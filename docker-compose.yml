services:
  postgres:
    image: postgres:18-alpine
    container_name:  caveissue-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresql -d caveissue"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: caveissue
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_caveissue:/var/lib/postgresql/data

volumes:
  postgres_caveissue:
